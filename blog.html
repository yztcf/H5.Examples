<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZhitingOS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ===== 完全复制 index 的背景 ===== */
        body {
            background: #2B7FD8;
            min-height: 100vh;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        /* ===== 顶部栏 ===== */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 24px;
            background: rgba(43, 127, 216, 0.96);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.92);
            font-size: 12px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .top-bar .logo {
            font-family: 'Caveat', cursive;
            font-size: 18px;
            font-weight: 700;
            color: #F4D758;
        }
        .top-bar .logo span {
            color: rgba(255, 255, 255, 0.4);
            font-size: 11px;
            margin-left: 6px;
        }
        .top-bar .clock {
            font-family: 'Fira Code', monospace;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.55);
        }

        /* ===== 页面内容 ===== */
        .page {
            max-width: 1100px;
            margin: 0 auto;
            padding: 30px 20px 60px;
        }

        /* ===== 标题 ===== */
        .page h1 {
            font-family: 'Caveat', cursive;
            font-size: 48px;
            color: #F4D758;
            text-align: center;
            margin-bottom: 4px;
        }
        .page .sub {
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            font-size: 16px;
            margin-bottom: 30px;
        }

        /* ===== iPhone 模拟器 ===== */
        .iphone-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 32px;
        }
        .iphone {
            --scale: 0.55;
            width: calc(534px * var(--scale));
            height: calc(1102px * var(--scale));
            position: relative;
            user-select: none;
            flex-shrink: 0;
        }
        .iphone_mask {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }
        .iphone_back {
            position: absolute;
            left: 10px;
            top: 10px;
            border-radius: 40px;
            width: calc(100% - 20px);
            height: calc(100% - 20px);
            pointer-events: none;
            object-fit: cover;
        }
        .iphone_status {
            position: absolute;
            left: 55px;
            right: 45px;
            top: 32px;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: Helvetica, sans-serif;
            font-size: 18px;
            pointer-events: none;
            z-index: 2;
        }
        .iphone_status_right {
            height: 12px;
        }
        .iphone_bottom {
            display: flex;
            justify-content: space-around;
            align-items: center;
            width: 85%;
            height: 88px;
            border-radius: 34px;
            background-color: rgba(244, 244, 244, 0.7);
            box-shadow: 2px 2px 2px rgba(0, 0, 0, 0.04);
            position: absolute;
            bottom: 25px;
            left: 50%;
            box-sizing: border-box;
            transform: translateX(-50%);
            padding: 0 5px;
            z-index: 2;
        }
        .iphone_app_icon {
            width: 55px;
            height: 55px;
            border-radius: 15px;
            object-fit: cover;
            pointer-events: all;
            cursor: pointer;
            transition: filter 0.2s;
        }
        .iphone_app_icon:active,
        .iphone_app_icon:hover {
            filter: brightness(60%);
        }

        /* ===== iPhone 菜单 ===== */
        .iphone_menu {
            display: flex;
            position: absolute;
            left: 15px;
            padding: 0 15px 85px;
            top: 90px;
            width: calc(534px * var(--scale) - 30px);
            box-sizing: border-box;
            overflow: hidden;
            z-index: 2;
        }
        .iphone_menu_track {
            display: flex;
            pointer-events: none;
        }
        .iphone_menu_track.anim {
            transition: transform 0.5s ease-in-out;
        }
        .iphone_app_grid {
            display: grid;
            width: calc(534px * var(--scale) - 60px);
            grid-template-columns: repeat(4, 25%);
            margin-right: 30px;
            row-gap: 20px;
        }
        .iphone_app {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .iphone_app .iphone_app_text {
            text-align: center;
            font-size: 13px;
            margin-top: 5px;
            width: 100%;
            color: #fff;
            text-overflow: ellipsis;
            overflow: hidden;
            word-break: break-all;
            white-space: nowrap;
            font-weight: 400;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
        }

        /* ===== 底部 ===== */
        .footer {
            text-align: center;
            padding: 30px 20px 20px;
            color: rgba(255, 255, 255, 0.25);
            font-size: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            margin-top: 10px;
        }
        .footer span {
            color: #F4D758;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 768px) {
            .iphone {
                --scale: 0.4;
            }
            .iphone_status {
                font-size: 14px;
                left: 40px;
                right: 35px;
                top: 26px;
            }
            .iphone_bottom {
                height: 64px;
                bottom: 18px;
            }
            .iphone_app_icon {
                width: 40px;
                height: 40px;
                border-radius: 12px;
            }
            .iphone_menu {
                top: 72px;
                padding: 0 10px 60px;
                left: 10px;
                width: calc(534px * var(--scale) - 20px);
            }
            .iphone_app_grid {
                width: calc(534px * var(--scale) - 40px);
                row-gap: 14px;
            }
            .iphone_app .iphone_app_text {
                font-size: 11px;
            }
            .page h1 {
                font-size: 36px;
            }
        }

        @media (max-width: 480px) {
            .iphone {
                --scale: 0.32;
            }
            .iphone_status {
                font-size: 11px;
                left: 32px;
                right: 28px;
                top: 20px;
            }
            .iphone_bottom {
                height: 48px;
                bottom: 14px;
            }
            .iphone_app_icon {
                width: 30px;
                height: 30px;
                border-radius: 8px;
            }
            .iphone_menu {
                top: 56px;
                padding: 0 8px 44px;
                left: 8px;
                width: calc(534px * var(--scale) - 16px);
            }
            .iphone_app_grid {
                width: calc(534px * var(--scale) - 32px);
                row-gap: 10px;
            }
            .iphone_app .iphone_app_text {
                font-size: 9px;
            }
            .page h1 {
                font-size: 28px;
            }
            .page .sub {
                font-size: 13px;
            }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Fira+Code:wght@400&display=swap" rel="stylesheet">
</head>
<body>

    <!-- ===== 顶部栏 ===== -->
    <div class="top-bar">
        <div class="logo">Zhiting <span>✦ 练习</span></div>
        <div class="clock" id="clock">--:--</div>
    </div>

    <!-- ===== 内容 ===== -->
    <div class="page">
        <h1>做你自己</h1>
        <div class="sub">Be yourself, everyone else is already taken.</div>

        <!-- iPhone -->
        <div class="iphone-wrapper">
            <div class="iphone" id="iphone">
                <img class="iphone_back" src="./assets/iphoneBack.jpeg" alt="">
                <img class="iphone_mask" src="./assets/iphoneMask.png" alt="">
                <div class="iphone_status">
                    <div class="iphone_time" id="iphoneTime"></div>
                    <img class="iphone_status_right" src="./assets/iphoneStatusRight.png" alt="">
                </div>
                <div class="iphone_bottom">
                    <img class="iphone_app_icon" src="./assets/icon/message.png" alt="消息">
                    <img class="iphone_app_icon" src="./assets/icon/wechat.png" alt="微信">
                    <img class="iphone_app_icon" src="./assets/icon/qq.png" alt="QQ">
                    <img class="iphone_app_icon" src="./assets/icon/alipay.png" alt="支付宝">
                </div>
                <div class="iphone_menu">
                    <div class="iphone_menu_track" id="menuTrack"></div>
                </div>
            </div>
        </div>

        <div class="footer"><span>✦</span> H5.Examples · 由 ZhitingOS 驱动 <span>✦</span></div>
    </div>

    <script>
        // ===== 时钟 =====
        function updateClock() {
            const now = new Date();
            const t = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').textContent = t;
            document.getElementById('iphoneTime').textContent = t;
        }
        updateClock();
        setInterval(updateClock, 30000);

        // ===== 加载 examples.txt =====
        const r = new XMLHttpRequest();
        r.open('get', './examples.txt');
        r.onloadend = () => {
            const navData = r.responseText
                .split('\n')
                .filter(a => a && !a.includes('index') && !a.includes('blog'));

            const track = document.getElementById('menuTrack');
            let grid = null;

            for (const line of navData) {
                const num = line.match(/^(\d+)/)?.[1] || '';
                const name = line.replace(/^\d+\./, '').replace(/\.html$/, '');
                const src = './' + line.replace('\r', '');

                if (!grid) {
                    grid = document.createElement('div');
                    grid.className = 'iphone_app_grid';
                }

                const app = document.createElement('div');
                app.className = 'iphone_app';

                const img = document.createElement('img');
                img.className = 'iphone_app_icon';
                img.loading = 'lazy';
                img.decoding = 'async';
                img.src = `./assets/preview/${num}.png`;
                img.onerror = function() { this.style.display = 'none'; };
                img.addEventListener('click', () => {
                    const base = location.href.replace('/blog.html', '');
                    window.open(base + src.slice(1), '_blank');
                });

                const label = document.createElement('div');
                label.className = 'iphone_app_text';
                label.textContent = name;

                app.appendChild(img);
                app.appendChild(label);
                grid.appendChild(app);

                if (grid.children.length === 20) {
                    track.appendChild(grid);
                    grid = null;
                }
            }
            if (grid) track.appendChild(grid);

            // ===== 滑动翻页 =====
            const menu = document.querySelector('.iphone_menu');
            let translateX = 0,
                lastTranslateX = 0,
                sx = 0,
                allowMove = false;

            menu.addEventListener('mousedown', (e) => {
                allowMove = true;
                sx = e.x;
                track.classList.remove('anim');
            });

            document.addEventListener('mousemove', (e) => {
                if (allowMove) {
                    translateX = e.x - sx + lastTranslateX;
                    track.style.transform = `translateX(${translateX}px)`;
                }
            });

            document.addEventListener('mouseup', () => {
                allowMove = false;
                const gridWidth = 343;
                const pageCount = track.children.length;
                const maxLeft = -gridWidth * (pageCount - 1);

                if (translateX > gridWidth / 2 * -1) {
                    translateX = 0;
                } else {
                    translateX = Math.round(translateX / gridWidth) * gridWidth;
                }
                if (translateX < maxLeft) translateX = maxLeft;

                lastTranslateX = translateX;
                track.style.transform = `translateX(${translateX}px)`;
                track.classList.add('anim');
            });

            // 触屏
            let touchStartX = 0,
                touchStartTranslate = 0,
                isTouching = false;

            menu.addEventListener('touchstart', (e) => {
                const touch = e.touches[0];
                touchStartX = touch.clientX;
                touchStartTranslate = lastTranslateX;
                isTouching = true;
                track.classList.remove('anim');
            }, { passive: true });

            menu.addEventListener('touchmove', (e) => {
                if (!isTouching) return;
                const touch = e.touches[0];
                translateX = touchStartTranslate + touch.clientX - touchStartX;
                track.style.transform = `translateX(${translateX}px)`;
            }, { passive: true });

            menu.addEventListener('touchend', () => {
                if (!isTouching) return;
                isTouching = false;
                const gridWidth = 343;
                const pageCount = track.children.length;
                const maxLeft = -gridWidth * (pageCount - 1);

                if (translateX > gridWidth / 2 * -1) {
                    translateX = 0;
                } else {
                    translateX = Math.round(translateX / gridWidth) * gridWidth;
                }
                if (translateX < maxLeft) translateX = maxLeft;

                lastTranslateX = translateX;
                track.style.transform = `translateX(${translateX}px)`;
                track.classList.add('anim');
            }, { passive: true });
        };
        r.send();
    </script>
</body>
</html>
