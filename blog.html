<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>H5.Examples · ZhitingOS</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Fira+Code:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #2B7FD8;
            color: #e6ecf5;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ===== 蓝色幕布背景 (完全复制 index) ===== */
        .bg-canvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: #2B7FD8;
            overflow: hidden;
        }
        /* 幕布纹理 */
        .bg-canvas::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(255, 255, 255, 0.05) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 30%, rgba(255, 255, 255, 0.03) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(0, 0, 0, 0.08) 0%, transparent 50%);
            pointer-events: none;
        }
        /* 幕布上的星星 (完全复制 index 的 wp-star) */
        .bg-canvas .star {
            position: absolute;
            color: #F4D758;
            font-size: var(--size, 14px);
            opacity: var(--op, 0.6);
            animation: wp-twinkle var(--dur, 3s) ease-in-out infinite alternate;
            pointer-events: none;
            user-select: none;
        }
        @keyframes wp-twinkle {
            0% { opacity: calc(var(--op, 0.6) * 0.25); transform: scale(0.8) rotate(0deg); }
            100% { opacity: var(--op, 0.6); transform: scale(1.1) rotate(8deg); }
        }

        /* ===== 主容器 ===== */
        .home-container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* ===== 顶部菜单栏 (完全复制 index 的 desktop-menubar) ===== */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 24px;
            background: rgba(43, 127, 216, 0.96);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            position: sticky;
            top: 0;
            z-index: 100;
            font-family: 'Noto Sans SC', sans-serif;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.92);
        }
        .top-bar .logo {
            font-family: 'Caveat', cursive;
            font-size: 18px;
            font-weight: 700;
            color: #F4D758;
            letter-spacing: 0.5px;
        }
        .top-bar .logo span {
            color: rgba(255, 255, 255, 0.4);
            font-size: 11px;
            font-family: 'Fira Code', monospace;
            margin-left: 6px;
            font-weight: 400;
        }
        .top-bar .nav-links {
            display: flex;
            gap: 18px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.55);
        }
        .top-bar .nav-links a {
            color: inherit;
            text-decoration: none;
            transition: color 0.2s;
        }
        .top-bar .nav-links a:hover {
            color: #F4D758;
        }
        .top-bar .clock {
            font-family: 'Fira Code', monospace;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.55);
        }

        /* ===== Hero 区域 ===== */
        .hero-section {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 85vh;
            padding: 40px 20px;
            position: relative;
        }
        .hero-section .hero-content {
            text-align: center;
            max-width: 760px;
        }
        .hero-section .hero-title {
            font-family: 'Caveat', cursive;
            font-size: clamp(44px, 6.5vw, 76px);
            font-weight: 700;
            color: #F4D758;
            margin-bottom: 8px;
            line-height: 1.1;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.15);
        }
        .hero-section .hero-sub {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.7);
            letter-spacing: 2px;
            margin-bottom: 6px;
            font-weight: 300;
        }
        .hero-section .hero-desc {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
            line-height: 1.8;
            max-width: 520px;
            margin: 0 auto 28px;
        }
        .hero-section .hero-badge {
            display: inline-block;
            background: rgba(244, 215, 88, 0.15);
            border: 1px solid rgba(244, 215, 88, 0.2);
            padding: 5px 18px;
            border-radius: 30px;
            font-size: 12px;
            color: #F4D758;
            font-family: 'Fira Code', monospace;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        /* ===== iPhone 模拟器 ===== */
        .iphone-wrapper {
            display: flex;
            justify-content: center;
            margin: 32px 0 10px;
        }
        .iphone {
            --scale: 0.65;
            width: calc(534px * var(--scale));
            height: calc(1102px * var(--scale));
            position: relative;
            user-select: none;
            flex-shrink: 0;
        }
        .iphone_mask {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }
        .iphone_back {
            position: absolute;
            left: 10px;
            top: 10px;
            border-radius: 40px;
            width: calc(100% - 20px);
            height: calc(100% - 20px);
            pointer-events: none;
            object-fit: cover;
        }
        .iphone_status {
            position: absolute;
            left: 55px;
            right: 45px;
            top: 32px;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: Helvetica, sans-serif;
            font-size: 18px;
            pointer-events: none;
            z-index: 2;
        }
        .iphone_status_right {
            height: 12px;
        }
        .iphone_bottom {
            display: flex;
            justify-content: space-around;
            align-items: center;
            width: 85%;
            height: 88px;
            border-radius: 34px;
            background-color: rgba(244, 244, 244, 0.7);
            box-shadow: 2px 2px 2px rgba(0, 0, 0, 0.04);
            position: absolute;
            bottom: 25px;
            left: 50%;
            box-sizing: border-box;
            transform: translateX(-50%);
            padding: 0 5px;
            z-index: 2;
        }
        .iphone_app_icon {
            width: 55px;
            height: 55px;
            border-radius: 15px;
            object-fit: cover;
            pointer-events: all;
            cursor: pointer;
            transition: filter 0.2s;
        }
        .iphone_app_icon:active,
        .iphone_app_icon:hover {
            filter: brightness(60%);
        }

        /* ===== iPhone 菜单 ===== */
        .iphone_menu {
            display: flex;
            position: absolute;
            left: 15px;
            padding: 0 15px 85px;
            top: 90px;
            width: calc(534px * var(--scale) - 30px);
            box-sizing: border-box;
            overflow: hidden;
            z-index: 2;
        }
        .iphone_menu_track {
            display: flex;
            pointer-events: none;
        }
        .iphone_menu_track.anim {
            transition: transform 0.5s ease-in-out;
        }
        .iphone_app_grid {
            display: grid;
            width: calc(534px * var(--scale) - 60px);
            grid-template-columns: repeat(4, 25%);
            margin-right: 30px;
            row-gap: 20px;
        }
        .iphone_app {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .iphone_app .iphone_app_text {
            text-align: center;
            font-size: 13px;
            margin-top: 5px;
            width: 100%;
            color: #fff;
            text-overflow: ellipsis;
            overflow: hidden;
            word-break: break-all;
            white-space: nowrap;
            font-weight: 400;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
        }

        /* ===== 底部 ===== */
        .footer {
            text-align: center;
            padding: 30px 20px 50px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.25);
            font-size: 12px;
            font-family: 'Fira Code', monospace;
            letter-spacing: 1px;
        }
        .footer span {
            color: #F4D758;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 768px) {
            .top-bar {
                padding: 8px 14px;
                flex-wrap: wrap;
                gap: 6px;
            }
            .top-bar .logo {
                font-size: 16px;
            }
            .top-bar .logo span {
                font-size: 10px;
                margin-left: 4px;
            }
            .top-bar .nav-links {
                gap: 12px;
                font-size: 11px;
                order: 3;
                width: 100%;
                justify-content: center;
                padding-top: 4px;
            }
            .top-bar .clock {
                font-size: 11px;
            }
            .iphone {
                --scale: 0.45;
            }
            .iphone_status {
                font-size: 14px;
                left: 40px;
                right: 35px;
                top: 26px;
            }
            .iphone_bottom {
                height: 64px;
                bottom: 18px;
            }
            .iphone_app_icon {
                width: 40px;
                height: 40px;
                border-radius: 12px;
            }
            .iphone_menu {
                top: 72px;
                padding: 0 10px 60px;
                left: 10px;
                width: calc(534px * var(--scale) - 20px);
            }
            .iphone_app_grid {
                width: calc(534px * var(--scale) - 40px);
                row-gap: 14px;
            }
            .iphone_app .iphone_app_text {
                font-size: 11px;
            }
            .hero-section .hero-title {
                font-size: 34px;
            }
            .hero-section .hero-sub {
                font-size: 15px;
            }
        }

        @media (max-width: 480px) {
            .iphone {
                --scale: 0.35;
            }
            .iphone_status {
                font-size: 11px;
                left: 32px;
                right: 28px;
                top: 20px;
            }
            .iphone_bottom {
                height: 50px;
                bottom: 12px;
            }
            .iphone_app_icon {
                width: 32px;
                height: 32px;
                border-radius: 10px;
            }
            .iphone_menu {
                top: 56px;
                padding: 0 8px 44px;
                left: 8px;
                width: calc(534px * var(--scale) - 16px);
            }
            .iphone_app_grid {
                width: calc(534px * var(--scale) - 32px);
                row-gap: 10px;
            }
            .iphone_app .iphone_app_text {
                font-size: 9px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== 蓝色幕布背景 (完全复制 index) ===== -->
    <div class="bg-canvas" id="bgCanvas"></div>

    <!-- ===== 顶部菜单栏 (完全复制 index 的 desktop-menubar) ===== -->
    <nav class="top-bar">
        <div class="logo">
            H5.Examples
            <span>✦ zhitingOS</span>
        </div>
        <div class="nav-links">
            <a href="#">探索</a>
            <a href="#">项目</a>
            <a href="#">关于</a>
        </div>
        <div class="clock" id="topClock">--:--</div>
    </nav>

    <!-- ===== 主内容 ===== -->
    <div class="home-container">

        <!-- Hero + iPhone -->
        <section class="hero-section">
            <div class="hero-content">
                <div class="hero-badge">✦ 前端示例集</div>
                <div class="hero-title">做你自己</div>
                <div class="hero-sub">Be yourself, everyone else is already taken.</div>
                <div class="hero-desc">
                    包含文字溢出省略号、字体渐变、flex布局、刮刮卡、WebSQL、翻牌游戏、五子棋、拖拽上传、贪吃蛇、推箱子、拖拽换位、大富翁、飞机大战、连连看、猜位置、2048、观察物体等前端简单示例代码。
                </div>

                <!-- iPhone -->
                <div class="iphone-wrapper">
                    <div class="iphone" id="iphone">
                        <img class="iphone_back" src="./assets/iphoneBack.jpeg" alt="">
                        <img class="iphone_mask" src="./assets/iphoneMask.png" alt="">
                        <div class="iphone_status">
                            <div class="iphone_time" id="iphoneTime"></div>
                            <img class="iphone_status_right" src="./assets/iphoneStatusRight.png" alt="">
                        </div>
                        <div class="iphone_bottom">
                            <img class="iphone_app_icon" src="./assets/icon/message.png" alt="消息">
                            <img class="iphone_app_icon" src="./assets/icon/wechat.png" alt="微信">
                            <img class="iphone_app_icon" src="./assets/icon/qq.png" alt="QQ">
                            <img class="iphone_app_icon" src="./assets/icon/alipay.png" alt="支付宝">
                        </div>
                        <div class="iphone_menu">
                            <div class="iphone_menu_track" id="menuTrack"></div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Footer -->
        <footer class="footer">
            <span>✦</span> H5.Examples · 由 ZhitingOS 驱动 <span>✦</span>
        </footer>
    </div>

    <script>
        // =============================================
        // 1. 生成幕布星星 (完全复制 index 的 wp-star)
        // =============================================
        (function createStars() {
            const container = document.getElementById('bgCanvas');
            const starChars = ['✦', '✧', '⭐', '·'];
            // 生成 50 颗星星，跟 index 数量差不多
            for (let i = 0; i < 50; i++) {
                const star = document.createElement('span');
                star.className = 'star';
                star.textContent = starChars[i % starChars.length];
                const size = 8 + Math.random() * 16;
                star.style.setProperty('--size', size + 'px');
                star.style.setProperty('--op', (0.3 + Math.random() * 0.5));
                star.style.setProperty('--dur', (2 + Math.random() * 4) + 's');
                star.style.left = (Math.random() * 96 + 2) + '%';
                star.style.top = (Math.random() * 96 + 2) + '%';
                star.style.animationDelay = (Math.random() * 3) + 's';
                container.appendChild(star);
            }
        })();

        // =============================================
        // 2. 时钟
        // =============================================
        function updateClocks() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const time = h + ':' + m;
            document.getElementById('topClock').textContent = time;
            document.getElementById('iphoneTime').textContent = time;
        }
        updateClocks();
        setInterval(updateClocks, 30000);

        // =============================================
        // 3. 加载菜单
        // =============================================
        const r = new XMLHttpRequest();
        r.open('get', './examples.txt');
        r.onloadend = () => {
            const navData = r.responseText
                .split('\n')
                .filter(a => a && !a.includes('index') && !a.includes('blog'));

            const navList = [];
            for (const nav of navData) {
                const navNumMatch = nav.match(/^(\d+)/);
                const navNum = navNumMatch ? navNumMatch[1] : '';
                const navName = nav.replace(/^\d+\./, '').replace(/\.html$/, '');
                const navSrc = './' + nav?.replace('\r', '');
                navList.push({ navNum, navName, navSrc });
            }

            const track = document.getElementById('menuTrack');
            let grid = null;

            for (let i = 0; i < navList.length; i++) {
                const item = navList[i];
                if (!grid) {
                    grid = document.createElement('div');
                    grid.className = 'iphone_app_grid';
                }

                const app = document.createElement('div');
                app.className = 'iphone_app';

                const img = document.createElement('img');
                img.className = 'iphone_app_icon';
                img.loading = 'lazy';
                img.decoding = 'async';
                img.src = `./assets/preview/${item.navNum}.png`;
                img.onerror = function() { this.style.display = 'none'; };
                img.addEventListener('click', () => {
                    const base = location.href.replace('/blog.html', '');
                    window.open(base + item.navSrc.slice(1), '_blank');
                });

                const label = document.createElement('div');
                label.className = 'iphone_app_text';
                label.textContent = item.navName;

                app.appendChild(img);
                app.appendChild(label);
                grid.appendChild(app);

                if (grid.children.length === 20) {
                    track.appendChild(grid);
                    grid = null;
                }
            }
            if (grid) track.appendChild(grid);

            // =============================================
            // 4. 滑动翻页
            // =============================================
            const menu = document.querySelector('.iphone_menu');
            let translateX = 0;
            let lastTranslateX = 0;
            let sx = 0;
            let allowMove = false;

            menu.addEventListener('mousedown', (e) => {
                allowMove = true;
                sx = e.x;
                track.classList.remove('anim');
            });

            document.addEventListener('mousemove', (e) => {
                if (allowMove) {
                    translateX = e.x - sx + lastTranslateX;
                    track.style.transform = `translateX(${translateX}px)`;
                }
            });

            document.addEventListener('mouseup', () => {
                allowMove = false;
                const gridWidth = 343;
                const pageCount = track.children.length;
                const maxLeft = -gridWidth * (pageCount - 1);

                if (translateX > gridWidth / 2 * -1) {
                    translateX = 0;
                } else {
                    translateX = Math.round(translateX / gridWidth) * gridWidth;
                }
                if (translateX < maxLeft) translateX = maxLeft;

                lastTranslateX = translateX;
                track.style.transform = `translateX(${translateX}px)`;
                track.classList.add('anim');
            });

            // 触屏支持
            let touchStartX = 0;
            let touchStartTranslate = 0;
            let isTouching = false;

            menu.addEventListener('touchstart', (e) => {
                const touch = e.touches[0];
                touchStartX = touch.clientX;
                touchStartTranslate = lastTranslateX;
                isTouching = true;
                track.classList.remove('anim');
            }, { passive: true });

            menu.addEventListener('touchmove', (e) => {
                if (!isTouching) return;
                const touch = e.touches[0];
                const deltaX = touch.clientX - touchStartX;
                translateX = touchStartTranslate + deltaX;
                track.style.transform = `translateX(${translateX}px)`;
            }, { passive: true });

            menu.addEventListener('touchend', () => {
                if (!isTouching) return;
                isTouching = false;
                const gridWidth = 343;
                const pageCount = track.children.length;
                const maxLeft = -gridWidth * (pageCount - 1);

                if (translateX > gridWidth / 2 * -1) {
                    translateX = 0;
                } else {
                    translateX = Math.round(translateX / gridWidth) * gridWidth;
                }
                if (translateX < maxLeft) translateX = maxLeft;

                lastTranslateX = translateX;
                track.style.transform = `translateX(${translateX}px)`;
                track.classList.add('anim');
            }, { passive: true });
        };
        r.send();
    </script>
</body>
</html>
