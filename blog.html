<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>H5.Examples</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #2B7FD8;
            min-height: 100vh;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            overflow-x: hidden;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 24px;
            background: rgba(43, 127, 216, 0.96);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.92);
            font-size: 12px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .top-bar .logo {
            font-family: 'Caveat', cursive;
            font-size: 18px;
            font-weight: 700;
            color: #F4D758;
        }
        .top-bar .logo span {
            color: rgba(255, 255, 255, 0.4);
            font-size: 11px;
            margin-left: 6px;
            font-family: 'Fira Code', monospace;
        }
        .top-bar .clock {
            font-family: 'Fira Code', monospace;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.55);
        }

        .main {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 80px);
            padding: 30px 40px 30px 60px;
            gap: 50px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .left {
            flex: 1;
            max-width: 600px;
        }
        .left .badge {
            display: inline-block;
            background: rgba(244, 215, 88, 0.15);
            border: 1px solid rgba(244, 215, 88, 0.2);
            padding: 4px 16px;
            border-radius: 30px;
            font-size: 12px;
            color: #F4D758;
            font-family: 'Fira Code', monospace;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }
        .left h1 {
            font-family: 'Caveat', cursive;
            font-size: 56px;
            font-weight: 700;
            color: #F4D758;
            line-height: 1.1;
            margin-bottom: 2px;
        }
        .left .sub {
            font-size: 17px;
            color: rgba(255, 255, 255, 0.65);
            letter-spacing: 2px;
            font-weight: 300;
            margin-bottom: 20px;
        }

        /* ===== MacBook ===== */
        .macbook {
            width: 100%;
            max-width: 500px;
        }
        .macbook-bezel {
            background: #2a2a30;
            border-radius: 14px 14px 0 0;
            padding: 14px;
            padding-top: 0;
            position: relative;
        }
        .macbook-notch {
            width: 130px;
            height: 14px;
            background: #2a2a30;
            border-radius: 0 0 10px 10px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }
        .macbook-screen {
            width: 100%;
            background: #1a1e2e;
            border-radius: 4px;
            overflow: hidden;
            min-height: 360px;
            position: relative;
        }
        .macbook-screen .screen-content {
            padding: 16px 18px 18px;
            position: relative;
            min-height: 360px;
            display: flex;
            flex-direction: column;
        }

        .screen-content .desktop-bg {
            position: absolute;
            inset: 0;
            z-index: 0;
            background: radial-gradient(ellipse at 30% 40%, rgba(43, 127, 216, 0.25), transparent 60%),
                radial-gradient(ellipse at 70% 60%, rgba(244, 215, 88, 0.04), transparent 50%),
                #131725;
            pointer-events: none;
            border-radius: 4px;
        }
        .screen-content .desktop-bg .star {
            position: absolute;
            color: rgba(244, 215, 88, 0.15);
            font-size: 8px;
            animation: twinkle 3s ease-in-out infinite alternate;
        }
        @keyframes twinkle {
            0% { opacity: 0.2; }
            100% { opacity: 0.7; }
        }

        .screen-content .term-bar {
            display: flex;
            align-items: center;
            gap: 7px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            margin-bottom: 12px;
            position: relative;
            z-index: 1;
            flex-shrink: 0;
        }
        .screen-content .term-bar .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        .screen-content .term-bar .dot.r { background: #ff5f57; }
        .screen-content .term-bar .dot.y { background: #ffbd2e; }
        .screen-content .term-bar .dot.g { background: #28ca41; }
        .screen-content .term-bar .label {
            color: rgba(255, 255, 255, 0.3);
            font-size: 11px;
            font-family: 'Fira Code', monospace;
            margin: 0 auto;
        }

        .screen-content .desktop-icons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            position: relative;
            z-index: 1;
            max-width: 240px;
            margin: 0 auto 12px;
            flex-shrink: 0;
        }
        .screen-content .desktop-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: rgba(255, 255, 255, 0.9);
            padding: 12px 6px 10px;
            border-radius: 12px;
            transition: all 0.25s ease;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .screen-content .desktop-icon:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.1);
            transform: translateY(-3px);
        }
        .screen-content .desktop-icon .icon-img {
            width: 64px;
            height: 64px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin-bottom: 4px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.04);
            overflow: hidden;
        }
        .screen-content .desktop-icon .icon-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 14px;
        }
        .screen-content .desktop-icon .icon-label {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.7);
            text-align: center;
            line-height: 1.2;
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.6);
        }

        /* ===== 可交互终端 ===== */
        .screen-content .terminal-box {
            position: relative;
            z-index: 1;
            margin-top: 8px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            flex-shrink: 0;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .screen-content .terminal-box .term-output {
            font-family: 'Fira Code', monospace;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.35);
            min-height: 40px;
            margin-bottom: 6px;
            line-height: 1.8;
            flex: 1;
            overflow-y: auto;
            max-height: 120px;
        }
        .screen-content .terminal-box .term-output .err {
            color: #ff5f57;
        }
        .screen-content .terminal-box .term-output .ok {
            color: #28ca41;
        }
        .screen-content .terminal-box .term-output .gold {
            color: #F4D758;
        }
        .screen-content .terminal-box .term-output .dim {
            color: rgba(255, 255, 255, 0.2);
        }
        .screen-content .terminal-box .term-output .bold {
            font-weight: 700;
        }
        .screen-content .terminal-box .term-output .line {
            padding: 1px 0;
        }
        .screen-content .terminal-box .term-input-row {
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: 'Fira Code', monospace;
            font-size: 11px;
            flex-shrink: 0;
        }
        .screen-content .terminal-box .term-input-row .prompt {
            color: #28ca41;
            flex-shrink: 0;
            white-space: nowrap;
        }
        .screen-content .terminal-box .term-input-row .prompt .user {
            color: #F4D758;
        }
        .screen-content .terminal-box .term-input-row input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: rgba(255, 255, 255, 0.8);
            font-family: 'Fira Code', monospace;
            font-size: 11px;
            padding: 2px 0;
            min-width: 40px;
            caret-color: #F4D758;
        }
        .screen-content .terminal-box .term-input-row input::placeholder {
            color: rgba(255, 255, 255, 0.12);
        }
        .screen-content .terminal-box .term-input-row input.password-mode {
            -webkit-text-security: disc;
            text-security: disc;
        }
        .screen-content .terminal-box .term-input-row .cursor-blink {
            display: inline-block;
            width: 8px;
            height: 14px;
            background: rgba(255, 255, 255, 0.3);
            animation: blink 0.9s step-end infinite;
            flex-shrink: 0;
        }
        @keyframes blink {
            0%,
            100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .macbook-hinge {
            width: 100%;
            height: 3px;
            background: linear-gradient(180deg, #8a8a8e 0%, #6e6e72 100%);
            border-radius: 0 0 2px 2px;
        }
        .macbook-base {
            width: 100%;
            height: 14px;
            background: linear-gradient(180deg, #c8c8cc 0%, #a8a8ac 30%, #b8b8bc 70%, #9a9a9e 100%);
            border-radius: 0 0 10px 10px;
        }
        .macbook-shadow {
            width: 90%;
            height: 30px;
            background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.2) 0%, transparent 70%);
            margin: 4px auto 0;
        }

        /* ===== iPhone ===== */
        .right {
            flex-shrink: 0;
        }
        .iphone {
            --scale: 0.6;
            width: calc(534px * var(--scale));
            height: calc(1102px * var(--scale));
            position: relative;
            user-select: none;
            flex-shrink: 0;
        }
        .iphone_mask {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }
        .iphone_back {
            position: absolute;
            left: 10px;
            top: 10px;
            border-radius: 40px;
            width: calc(100% - 20px);
            height: calc(100% - 20px);
            pointer-events: none;
            object-fit: cover;
        }
        .iphone_status {
            position: absolute;
            left: 55px;
            right: 45px;
            top: 32px;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: Helvetica, sans-serif;
            font-size: 18px;
            pointer-events: none;
            z-index: 2;
        }
        .iphone_status_right {
            height: 12px;
        }
        .iphone_bottom {
            display: flex;
            justify-content: space-around;
            align-items: center;
            width: 85%;
            height: 88px;
            border-radius: 34px;
            background-color: rgba(244, 244, 244, 0.7);
            box-shadow: 2px 2px 2px rgba(0, 0, 0, 0.04);
            position: absolute;
            bottom: 25px;
            left: 50%;
            box-sizing: border-box;
            transform: translateX(-50%);
            padding: 0 5px;
            z-index: 2;
        }
        .iphone_app_icon {
            width: 55px;
            height: 55px;
            border-radius: 15px;
            object-fit: cover;
            pointer-events: all;
            cursor: pointer;
            transition: filter 0.2s;
        }
        .iphone_app_icon:active,
        .iphone_app_icon:hover {
            filter: brightness(60%);
        }
        .iphone_menu {
            display: flex;
            position: absolute;
            left: 15px;
            padding: 0 15px 85px;
            top: 90px;
            width: calc(534px * var(--scale) - 30px);
            box-sizing: border-box;
            overflow: hidden;
            z-index: 2;
        }
        .iphone_menu_track {
            display: flex;
            pointer-events: none;
        }
        .iphone_menu_track.anim {
            transition: transform 0.5s ease-in-out;
        }
        .iphone_app_grid {
            display: grid;
            width: calc(534px * var(--scale) - 60px);
            grid-template-columns: repeat(4, 25%);
            margin-right: 30px;
            row-gap: 20px;
        }
        .iphone_app {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .iphone_app .iphone_app_text {
            text-align: center;
            font-size: 13px;
            margin-top: 5px;
            width: 100%;
            color: #fff;
            text-overflow: ellipsis;
            overflow: hidden;
            word-break: break-all;
            white-space: nowrap;
            font-weight: 400;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
        }

        .footer {
            text-align: center;
            padding: 20px 20px 30px;
            color: rgba(255, 255, 255, 0.2);
            font-size: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
        }
        .footer span {
            color: #F4D758;
        }

        @media (max-width: 1100px) {
            .main { padding: 30px 30px; gap: 30px; }
            .left h1 { font-size: 44px; }
            .iphone { --scale: 0.5; }
            .macbook { max-width: 420px; }
            .screen-content .desktop-icons { max-width: 210px; }
            .screen-content .desktop-icon .icon-img { width: 56px; height: 56px; font-size: 26px; }
        }

        @media (max-width: 820px) {
            .main { flex-direction: column; padding: 30px 20px; gap: 24px; min-height: auto; }
            .left { max-width: 100%; text-align: center; }
            .left h1 { font-size: 40px; }
            .left .sub { font-size: 16px; }
            .macbook { max-width: 420px; margin: 0 auto; }
            .right { width: 100%; display: flex; justify-content: center; }
            .iphone { --scale: 0.4; }
        }

        @media (max-width: 500px) {
            .top-bar { padding: 8px 14px; flex-wrap: wrap; gap: 4px; }
            .top-bar .logo { font-size: 15px; }
            .top-bar .logo span { font-size: 10px; margin-left: 4px; }
            .top-bar .clock { font-size: 10px; }
            .left h1 { font-size: 32px; }
            .left .sub { font-size: 14px; }
            .macbook { max-width: 100%; }
            .macbook-bezel { padding: 10px; border-radius: 10px 10px 0 0; }
            .macbook-notch { width: 80px; height: 10px; }
            .macbook-screen { min-height: 300px; }
            .macbook-screen .screen-content { padding: 12px 12px 14px; min-height: 300px; }
            .screen-content .term-bar { padding-bottom: 8px; margin-bottom: 10px; }
            .screen-content .term-bar .dot { width: 8px; height: 8px; }
            .screen-content .term-bar .label { font-size: 9px; }
            .screen-content .desktop-icons { max-width: 180px; gap: 10px; }
            .screen-content .desktop-icon .icon-img { width: 48px; height: 48px; font-size: 22px; border-radius: 12px; }
            .screen-content .desktop-icon .icon-label { font-size: 9px; }
            .screen-content .terminal-box .term-output { font-size: 10px; max-height: 80px; }
            .screen-content .terminal-box .term-input-row { font-size: 10px; }
            .screen-content .terminal-box .term-input-row input { font-size: 10px; }
            .macbook-base { height: 10px; border-radius: 0 0 8px 8px; }
            .macbook-shadow { height: 20px; }
            .iphone { --scale: 0.32; }
        }

        @media (max-width: 380px) {
            .screen-content .desktop-icons { max-width: 150px; gap: 8px; }
            .screen-content .desktop-icon .icon-img { width: 42px; height: 42px; font-size: 18px; }
            .screen-content .desktop-icon .icon-label { font-size: 8px; }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>

    <div class="top-bar">
        <div class="logo">H5.Examples <span>✦ zhitingOS</span></div>
        <div class="clock" id="clock">--:--</div>
    </div>

    <div class="main">

        <div class="left">
            <div class="badge">✦ 前端示例集</div>
            <h1>做你自己</h1>
            <div class="sub">Be yourself, everyone else is already taken.</div>

            <div class="macbook">
                <div class="macbook-bezel">
                    <div class="macbook-notch"></div>
                    <div class="macbook-screen">
                        <div class="screen-content">

                            <div class="desktop-bg">
                                <span class="star" style="top:6%;left:4%;animation-delay:0s;">✦</span>
                                <span class="star" style="top:12%;right:6%;animation-delay:1.2s;">✦</span>
                                <span class="star" style="bottom:18%;left:10%;animation-delay:2.4s;">✦</span>
                                <span class="star" style="bottom:10%;right:4%;animation-delay:0.6s;">✦</span>
                                <span class="star" style="top:5%;left:44%;animation-delay:1.8s;">✦</span>
                            </div>

                            <div class="term-bar">
                                <span class="dot r"></span>
                                <span class="dot y"></span>
                                <span class="dot g"></span>
                                <span class="label">esther@workspace ~ zsh</span>
                            </div>

                            <div class="desktop-icons">
                                <a class="desktop-icon" href="https://www.xiaohongshu.com/user/profile/55c6c7695894460904f87b47" target="_blank">
                                    <div class="icon-img">📕</div>
                                    <span class="icon-label">小红书内容</span>
                                </a>
                                <a class="desktop-icon" href="#" target="_blank">
                                    <div class="icon-img">🎨</div>
                                    <span class="icon-label">Design Skill</span>
                                </a>
                                <a class="desktop-icon" href="#" target="_blank">
                                    <div class="icon-img">🤖</div>
                                    <span class="icon-label">AI 实践</span>
                                </a>
                                <a class="desktop-icon" href="#" target="_blank">
                                    <div class="icon-img">🚀</div>
                                    <span class="icon-label">品牌运营</span>
                                </a>
                            </div>

                            <!-- 终端 -->
                            <div class="terminal-box">
                                <div class="term-output" id="termOutput">
                                    <div class="line"><span class="dim">💻 输入命令，需要 root 权限</span></div>
                                </div>
                                <div class="term-input-row">
                                    <span class="prompt"><span class="user">guest</span>@workspace ~ %</span>
                                    <input type="text" id="termInput" placeholder="输入命令..." autofocus>
                                    <span class="cursor-blink"></span>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
                <div class="macbook-hinge"></div>
                <div class="macbook-base"></div>
                <div class="macbook-shadow"></div>
            </div>

        </div>

        <div class="right">
            <div class="iphone" id="iphone">
                <img class="iphone_back" src="./assets/iphoneBack.jpeg" alt="">
                <img class="iphone_mask" src="./assets/iphoneMask.png" alt="">
                <div class="iphone_status">
                    <div class="iphone_time" id="iphoneTime"></div>
                    <img class="iphone_status_right" src="./assets/iphoneStatusRight.png" alt="">
                </div>
                <div class="iphone_bottom">
                    <img class="iphone_app_icon" src="./assets/icon/message.png" alt="消息">
                    <img class="iphone_app_icon" src="./assets/icon/wechat.png" alt="微信">
                    <img class="iphone_app_icon" src="./assets/icon/qq.png" alt="QQ">
                    <img class="iphone_app_icon" src="./assets/icon/alipay.png" alt="支付宝">
                </div>
                <div class="iphone_menu">
                    <div class="iphone_menu_track" id="menuTrack"></div>
                </div>
            </div>
        </div>

    </div>

    <div class="footer"><span>✦</span> H5.Examples · 由 ZhitingOS 驱动 <span>✦</span></div>

    <script>
        // ===== 时钟 =====
        function updateClock() {
            const now = new Date();
            const t = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').textContent = t;
            document.getElementById('iphoneTime').textContent = t;
        }
        updateClock();
        setInterval(updateClock, 30000);

        // ===== 终端状态机 =====
        const termInput = document.getElementById('termInput');
        const termOutput = document.getElementById('termOutput');

        // 状态: 'normal' 普通模式 | 'ask_root' 询问密码 | 'password' 输入密码
        let state = 'normal';
        let lastCommand = '';

        // 随机"需要root"的回复
        const needRootMessages = [
            '⚠️ 此命令需要 root 权限',
            '⛔ 权限不足：需要 root 才能执行',
            '❌ 拒绝访问：请使用 root 账户'
        ];

        // 随机"密码错误"的回复
        const wrongPasswordMessages = [
            '❌ 密码错误，请重试',
            '⛔ 认证失败：密码不正确'
        ];

        function appendOutput(html, className = '') {
            const div = document.createElement('div');
            div.className = 'line';
            div.innerHTML = html;
            termOutput.appendChild(div);
            termOutput.scrollTop = termOutput.scrollHeight;
        }

        function handleCommand(cmd) {
            const lower = cmd.toLowerCase().trim();

            if (state === 'normal') {
                // 任何命令都提示需要 root
                const msg = needRootMessages[Math.floor(Math.random() * needRootMessages.length)];
                appendOutput(`<span class="gold">$</span> ${cmd}`);
                appendOutput(`<span class="err">${msg}</span>`);
                appendOutput(`<span class="dim">💡 输入 "root" 切换到 root 用户</span>`);

                // 记录最后命令
                lastCommand = cmd;
                state = 'ask_root';

            } else if (state === 'ask_root') {
                if (lower === 'root' || lower === 'su' || lower === 'sudo su') {
                    // 切换到 root，要求输入密码
                    appendOutput(`<span class="gold">$</span> ${cmd}`);
                    appendOutput(`<span class="ok">🔓 切换到 root 用户</span>`);
                    appendOutput(`<span class="dim">请输入 root 密码：</span>`);
                    state = 'password';
                    // 切换输入框为密码模式
                    termInput.classList.add('password-mode');
                    termInput.placeholder = '输入密码...';
                    termInput.value = '';
                    // 更新提示符
                    document.querySelector('.prompt').innerHTML = '<span class="user">root</span>@workspace ~ #';
                } else {
                    // 还是普通命令，继续提示需要 root
                    const msg = needRootMessages[Math.floor(Math.random() * needRootMessages.length)];
                    appendOutput(`<span class="gold">$</span> ${cmd}`);
                    appendOutput(`<span class="err">${msg}</span>`);
                    appendOutput(`<span class="dim">💡 输入 "root" 切换到 root 用户</span>`);
                }

            } else if (state === 'password') {
                // 不管输入什么密码，都是错误
                const msg = wrongPasswordMessages[Math.floor(Math.random() * wrongPasswordMessages.length)];
                // 密码用星号显示
                const hidden = '*'.repeat(cmd.length);
                appendOutput(`<span class="dim">密码：${hidden}</span>`);
                appendOutput(`<span class="err">${msg}</span>`);
                appendOutput(`<span class="dim">💡 再试一次，或者输入 "exit" 回到 guest</span>`);

                // 退出密码模式回到普通
                state = 'normal';
                termInput.classList.remove('password-mode');
                termInput.placeholder = '输入命令...';
                document.querySelector('.prompt').innerHTML = '<span class="user">guest</span>@workspace ~ %';

                // 如果输入 exit 或 quit，回到普通模式
                if (lower === 'exit' || lower === 'quit' || lower === 'q') {
                    appendOutput(`<span class="dim">👋 回到 guest 用户</span>`);
                }
            }
        }

        termInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const cmd = this.value.trim();
                if (cmd === '') return;

                // 特殊处理 exit 在任何状态
                const lower = cmd.toLowerCase().trim();
                if (state === 'password' && (lower === 'exit' || lower === 'quit' || lower === 'q')) {
                    appendOutput(`<span class="dim">密码：${'*'.repeat(cmd.length)}</span>`);
                    appendOutput(`<span class="dim">👋 退出 root 切换，回到 guest</span>`);
                    state = 'normal';
                    termInput.classList.remove('password-mode');
                    termInput.placeholder = '输入命令...';
                    document.querySelector('.prompt').innerHTML = '<span class="user">guest</span>@workspace ~ %';
                    this.value = '';
                    setTimeout(() => this.focus(), 50);
                    return;
                }

                // 处理命令
                handleCommand(cmd);

                // 清空输入框
                this.value = '';
                setTimeout(() => this.focus(), 50);
            }
        });

        // 点击屏幕自动聚焦
        document.querySelector('.macbook-screen').addEventListener('click', function() {
            termInput.focus();
        });

        // ===== 加载 examples.txt =====
        const r = new XMLHttpRequest();
        r.open('get', './examples.txt');
        r.onloadend = () => {
            const navData = r.responseText
                .split('\n')
                .filter(a => a && !a.includes('index') && !a.includes('blog'));

            const track = document.getElementById('menuTrack');
            let grid = null;

            for (const line of navData) {
                const num = line.match(/^(\d+)/)?.[1] || '';
                const name = line.replace(/^\d+\./, '').replace(/\.html$/, '');
                const src = './' + line.replace('\r', '');

                if (!grid) {
                    grid = document.createElement('div');
                    grid.className = 'iphone_app_grid';
                }

                const app = document.createElement('div');
                app.className = 'iphone_app';

                const img = document.createElement('img');
                img.className = 'iphone_app_icon';
                img.loading = 'lazy';
                img.decoding = 'async';
                img.src = `./assets/preview/${num}.png`;
                img.onerror = function() { this.style.display = 'none'; };
                img.addEventListener('click', () => {
                    const base = location.href.replace('/blog.html', '');
                    window.open(base + src.slice(1), '_blank');
                });

                const label = document.createElement('div');
                label.className = 'iphone_app_text';
                label.textContent = name;

                app.appendChild(img);
                app.appendChild(label);
                grid.appendChild(app);

                if (grid.children.length === 20) {
                    track.appendChild(grid);
                    grid = null;
                }
            }
            if (grid) track.appendChild(grid);

            const menu = document.querySelector('.iphone_menu');
            let translateX = 0,
                lastTranslateX = 0,
                sx = 0,
                allowMove = false;

            menu.addEventListener('mousedown', (e) => {
                allowMove = true;
                sx = e.x;
                track.classList.remove('anim');
            });

            document.addEventListener('mousemove', (e) => {
                if (allowMove) {
                    translateX = e.x - sx + lastTranslateX;
                    track.style.transform = `translateX(${translateX}px)`;
                }
            });

            document.addEventListener('mouseup', () => {
                allowMove = false;
                const gridWidth = 343;
                const pageCount = track.children.length;
                const maxLeft = -gridWidth * (pageCount - 1);

                if (translateX > gridWidth / 2 * -1) {
                    translateX = 0;
                } else {
                    translateX = Math.round(translateX / gridWidth) * gridWidth;
                }
                if (translateX < maxLeft) translateX = maxLeft;

                lastTranslateX = translateX;
                track.style.transform = `translateX(${translateX}px)`;
                track.classList.add('anim');
            });

            let touchStartX = 0,
                touchStartTranslate = 0,
                isTouching = false;

            menu.addEventListener('touchstart', (e) => {
                const touch = e.touches[0];
                touchStartX = touch.clientX;
                touchStartTranslate = lastTranslateX;
                isTouching = true;
                track.classList.remove('anim');
            }, { passive: true });

            menu.addEventListener('touchmove', (e) => {
                if (!isTouching) return;
                const touch = e.touches[0];
                translateX = touchStartTranslate + touch.clientX - touchStartX;
                track.style.transform = `translateX(${translateX}px)`;
            }, { passive: true });

            menu.addEventListener('touchend', () => {
                if (!isTouching) return;
                isTouching = false;
                const gridWidth = 343;
                const pageCount = track.children.length;
                const maxLeft = -gridWidth * (pageCount - 1);

                if (translateX > gridWidth / 2 * -1) {
                    translateX = 0;
                } else {
                    translateX = Math.round(translateX / gridWidth) * gridWidth;
                }
                if (translateX < maxLeft) translateX = maxLeft;

                lastTranslateX = translateX;
                track.style.transform = `translateX(${translateX}px)`;
                track.classList.add('anim');
            }, { passive: true });
        };
        r.send();
    </script>
</body>
</html>
