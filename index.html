<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./assets/global.css">
    <title>H5.Examples - 作品集</title>
    <style>
        .home-container {
            background-color: #000;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        .iphone {
            top: 50%;
            transform: translateY(-50%);
            --scale: .7;
            width: calc(534px * var(--scale));
            height: calc(1102px * var(--scale));
            position: absolute;
            right: 12%;
            user-select: none;
        }
        .iphone_mask {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }
        .iphone_back {
            position: absolute;
            left: 0;
            top: 0;
            border-radius: 40px;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .iphone_status {
            position: absolute;
            left: 55px;
            right: 45px;
            top: 32px;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: Helvetica;
            font-size: 18px;
            pointer-events: none;
        }
        .iphone_status_right {
            height: 12px;
        }
        .iphone_bottom_bar {
            display: flex;
            justify-content: space-around;
            align-items: center;
            width: 85%;
            height: 88px;
            border-radius: 34px;
            background-color: rgba(244,244,244,.705);
            box-shadow: 0 2px 8px rgba(0,0,0,.04);
            position: absolute;
            bottom: 25px;
            left: 50%;
            box-sizing: border-box;
            transform: translateX(-50%);
            padding: 0 5px;
        }
        .iphone_app_icon {
            width: 55px;
            height: 55px;
            border-radius:15px;
            object-fit: cover;
            pointer-events: all;
            background:#ffffff;
        }
        .iphone_app_icon:active,
        .iphone_app_icon:hover {
            filter: brightness(60%);
        }
        .first-screen {
            display: flex;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }
        .first-screen video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .first-screen .first-content {
            position: absolute;
            color: #fff;
            font-family: Helvetica;
            left: 12%;
            top: 50%;
            transform: translate(0%, -50%);
        }
        .first-screen .title {
            font-size: 40px;
            font-weight: bold;
        }
        .first-screen .sub-title {
            margin-top:12px;
            font-size: 30px;
        }
        .iphone_menu {
            display: flex;
            position: absolute;
            left: 15px;
            padding: 0 15px 85px;
            top: 90px;
            width: calc(534px * var(--scale) - 30px);
            box-sizing: border-box;
            overflow: hidden;
        }
        .iphone_menu_track {
            display: flex;
            pointer-events: none;
            will-change: transform;
        }
        .iphone_menu_track.anim {
            transition: transform .5s ease-in-out;
        }
        .iphone_app_grid {
            display: grid;
            width: calc(534px * var(--scale) - 60px);
            grid-template-columns: repeat(4, 25%);
            margin-right: 30px;
            row-gap: 20px;
        }
        .iphone_app {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .iphone_app .app-text {
            text-align: center;
            font-size: 14px;
            margin-top: 5px;
            width: 100%;
            color: #fff;
            text-overflow: ellipsis;
            overflow: hidden;
            word-break: break-all;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div class="home-container">
        <div class="first-screen">
            <!-- <video src="./assets/bg.mp4" muted autoplay loop></video> -->
            <div class="first-content">
                <div class="title">做你自己，因为别人都有人做了。</div>
                <div class="sub-title">Be yourself, everyone else is already taken.</div>
            </div>
        </div>
        <div class="iphone">
            <img class="iphone_back" src="./assets/iphoneBack.jpeg">
            <img class="iphone_mask" src="./assets/iphoneMask.png">
            <div class="iphone_status">
                <div id="timeText"></div>
                <img class="iphone_status_right" src="./assets/statusBar.png">
            </div>
            <div class="iphone_menu">
                <div class="iphone_menu_track" id="menuTrack"></div>
            </div>
            <div class="iphone_bottom_bar">
                <img class="iphone_app_icon" src="./assets/icon/message.png">
                <img class="iphone_app_icon" src="./assets/icon/wechat.png">
                <img class="iphone_app_icon" src="./assets/icon/qq.png">
                <img class="iphone_app_icon" src="./assets/icon/alipay.png">
            </div>
        </div>
    </div>

<script type="module">
    // 更新时间
    const timeDom = document.querySelector("#timeText");
    function updateTime(){
        const d = new Date();
        let h = d.getHours().toString().padStart(2,'0');
        let m = d.getMinutes().toString().padStart(2,'0');
        timeDom.innerText = `${h}:${m}`;
    }
    updateTime();
    setInterval(updateTime,30*1000);

    const menuTrack = document.getElementById("menuTrack");
    let r = new XMLHttpRequest();
    r.open("GET","./examples.txt");
    r.onloadend = function(){
        const text = r.responseText;
        const lines = text.split(/\r?\n/).filter(line=>{
            const s = line.trim();
            return s && !s.includes("index") && !s.includes("blog");
        });

        const list = [];
        for(const line of lines){
            const match = line.match(/^(\d+)\.(.+)\.html$/);
            if(!match) continue;
            list.push({
                num: match[1],
                name: match[2],
                html: line.trim()
            })
        }

        // 全部内存构建，最后一次性渲染到页面，减少重绘
        const fragment = document.createDocumentFragment();
        let gridDom = createGrid();

        for(let i=0;i<list.length;i++){
            const item = list[i];
            const appDom = document.createElement("div");
            appDom.className = "iphone_app";

            const imgDom = document.createElement("img");
            imgDom.className = "iphone_app_icon";

            const textDom = document.createElement("div");
            textDom.className = "app-text";
            textDom.innerText = item.name;

            appDom.appendChild(imgDom);
            appDom.appendChild(textDom);

            // 关键：只尝试加载图片，404就保持白色背景，不反复请求
            imgDom.onerror = function(){
                this.style.display = "none";
            }
            imgDom.src = `./assets/preview/${item.num}.png`;

            // 点击跳转
            appDom.onclick = ()=> window.open("./"+item.html);

            gridDom.appendChild(appDom);

            if((i+1) % 20 === 0){
                fragment.appendChild(gridDom);
                gridDom = createGrid();
            }
        }
        fragment.appendChild(gridDom);
        menuTrack.appendChild(fragment);

        // =====拖拽逻辑优化，缓存变量，减少dom查询=====
        let translateX = 0;
        let lastX = 0;
        let isDrag = false;
        const pageWidth = menuTrack.querySelector(".iphone_app_grid").offsetWidth + 30;
        const pageCount = menuTrack.querySelectorAll(".iphone_app_grid").length;
        const maxOffset = -(pageWidth * (pageCount -1));

        menuTrack.addEventListener("mousedown",(e)=>{
            isDrag = true;
            lastX = e.clientX;
            menuTrack.classList.remove("anim");
        })
        window.addEventListener("mousemove",(e)=>{
            if(!isDrag) return;
            const dx = e.clientX - lastX;
            lastX = e.clientX;
            translateX += dx;
            if(translateX > 0) translateX = 0;
            if(translateX < maxOffset) translateX = maxOffset;
            menuTrack.style.transform = `translateX(${translateX}px)`;
        })
        window.addEventListener("mouseup",()=>{
            if(!isDrag) return;
            isDrag = false;
            menuTrack.classList.add("anim");
            let pageIndex = Math.round(-translateX / pageWidth);
            pageIndex = Math.max(0, Math.min(pageCount-1, pageIndex));
            translateX = -pageIndex * pageWidth;
            menuTrack.style.transform = `translateX(${translateX}px)`;
        })
    }
    r.send();

    function createGrid(){
        const div = document.createElement("div");
        div.className = "iphone_app_grid";
        return div;
    }
</script>
</body>
    <script>
    // 页面加载后直接跳转到设计器
    window.location.href = '设计器的链接.html';
</script>
    
</html>
